        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script>
            const svg = d3.select("#svg1");
            svg.style("transform", "scale(3)")
               .style("transform-origin", "top left");
            const timePath = d3.select("#time");
            const timeBox = timePath.node().getBBox();
            const digitalTime = svg.append("text")
                .attr("id", "digitalTime")
                .attr("x", timeBox.x + timeBox.width/2 - 3)
                .attr("y", timeBox.y + timeBox.height/2 + 3)
                .attr("text-anchor", "middle")
                .attr("dominant-baseline", "middle");
            const cfPath = d3.select("#ClockFace");
            const cfBox = cfPath.node().getBBox();
            const log = svg.append("text")
                .attr("id", "log")
                .attr("x", timeBox.x + 20)
                .attr("y", timeBox.y - 50)
                .attr("text-anchor", "start")
                .attr("dominant-baseline", "middle");

            function updateClock() {
                const now = new Date();
                const currentTime =
                    String(now.getHours()).padStart(2, "0") + ":" +
                    String(now.getMinutes()).padStart(2, "0") + ":" +
                    String(now.getSeconds()).padStart(2, "0");
                digitalTime.text(currentTime);
                
                const seconds = now.getSeconds();
                const ms = now.getMilliseconds();
                d3.range(6).forEach(i => {
                    if (seconds >= 5*(i+1) && seconds < 30+5*(i+1)) {
                        d3.select(`#sec5_${i}`).style("fill", "#000000");
                    } else {
                        d3.select(`#sec5_${i}`).style("fill", "#339299");
                    }
                });
                d3.range(10).forEach(i => {
                    if (seconds % 20 >= (i+1) && seconds % 20 < 10+(i+1)) {
                        d3.select(`#sec1_${i}`).style("fill", "#000000");
                    } else {
                        d3.select(`#sec1_${i}`).style("fill", "#b61717");
                    }
                });
                var sms = (seconds*1000 + ms)/100 % 100;
                //log.text(sms);
                d3.range(10).forEach(i => {
                    if (sms >= 5*(i+1) && sms < 50+5*(i+1)) {
                        d3.select(`#msec_${i}`).style("fill", "#000000");
                    } else {
                        d3.select(`#msec_${i}`).style("fill", "#b61717");
                    }
                });
            }
            updateClock();
            setInterval(updateClock, 250);
        </script>
